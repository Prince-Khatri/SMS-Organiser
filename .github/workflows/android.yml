name: Android CI
permissions:
  contents: write
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: 

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # check build 
    - name: Build with Gradle
      run: ./gradlew build

    # Release APK when Manually Triggred
    - name: Build Release APK
      if: github.event_name == 'workflow_dispatch'
      run: ./gradlew assembleRelease

    # Signing the APK
    - name: Sign APK
      if: github.event_name == 'workflow_dispatch'
      run: |
        # 1. Decode the keystore from your secret
        echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks
        
        # 2. Find the build-tools (zipalign and apksigner)
        BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -name "apksigner" | head -n 1 | xargs dirname)
        
        # 3. Zipalign the APK
        $BUILD_TOOLS_PATH/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-signed.apk
        
        # 4. Sign the APK
        $BUILD_TOOLS_PATH/apksigner sign --ks release.jks --ks-key-alias "${{ secrets.KEY_ALIAS }}" --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" --key-pass pass:"${{ secrets.KEY_PASSWORD }}" --out app-release-final.apk app-release-signed.apk
        
        # 5. Clean up the keystore file
        rm release.jks


    # Creating the release
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: SMS Organiser v1.0.${{ github.run_number }}
        files: app-release-final.apk 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
