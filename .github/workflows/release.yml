name: Android CD

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK
      id: sign_app
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks

        BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -name "apksigner" | head -n 1 | xargs dirname)

        # Zipalign
        $BUILD_TOOLS_PATH/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

        # Sign with new name
        $BUILD_TOOLS_PATH/apksigner sign \
          --ks release.jks \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --out sms_organiser.apk \
          app-release-aligned.apk

        $BUILD_TOOLS_PATH/apksigner verify sms_organiser.apk

        echo "signedReleaseFile=sms_organiser.apk" >> $GITHUB_OUTPUT

        rm release.jks

    - name: Verify APK
      run: ls -lh sms_organiser.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: SMS Organizer v1.0.${{ github.run_number }}
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
